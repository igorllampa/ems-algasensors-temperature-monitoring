server:
  port: '8082'

spring:
  application.name: temperature-monitoring
  datasource:
    username: sa
    url: jdbc:h2:file:~/algasensors-temperature-monitoring-db;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE;
    driverClassName: org.h2.Driver
    password: '123'
  h2:
    console:
      enabled: 'true'
      settings.web-allow-others: 'true'
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: 'false'
  rabbitmq:
    host: localhost
    port: 5672
    username: rabbitmq
    password: rabbitmq
    listener:
      simple:
        prefetch: 4 # limits the amount of messages that are captured per time by the consumer.
        retry: # define the retry parameters that will be used in case of communication or processing failing by consumer. After attempts the message will be removed from the queue in this case
          enabled: true
          initial-interval: 10s
          max-interval: 30s
          multiplier: 2
          max-attempts: 3
